name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install yt-dlp requests pyinstaller
      - name: Build exe
        run: pyinstaller --onefile --windowed --name ViralFinder --collect-submodules yt_dlp viral_finder_app.py
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: ViralFinder-windows
          path: dist/ViralFinder.exe
